name: Publish npm launcher

# Publishing runs here rather than from a maintainer's machine: GitHub-hosted
# runners reach registry.npmjs.org directly, and trusted publishing (OIDC) is
# only supported on cloud-hosted runners.

on:
  push:
    tags:
      - "npm-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and validate without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm

      - name: Restore exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Node tests
        run: npm run test:gateway

      - name: Run launcher tests
        run: npm run test:npm

      - name: Run PowerShell tests
        shell: pwsh
        run: ./tests/powershell/run-tests.ps1

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # Needed to attach the packed tarball to the release for this tag.
      contents: write
      # Required for trusted publishing and for provenance attestations.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - name: Restore exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check version consistency
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./packages/npm/package.json').version")"
          manifest_version="$(node -p "require('./releases/prod/latest.json').version")"

          if [[ "$package_version" != "$manifest_version" ]]; then
            echo "packages/npm is $package_version but releases/prod/latest.json is $manifest_version" >&2
            echo "A manifest ahead of the package makes every launcher try to update forever." >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#npm-v}"
            if [[ "$tag_version" != "$package_version" ]]; then
              echo "tag $GITHUB_REF_NAME does not match package version $package_version" >&2
              exit 1
            fi
          fi

          echo "Publishing version $package_version"

      - name: Build and inspect the tarball
        working-directory: packages/npm
        shell: bash
        run: |
          set -euo pipefail
          npm pack --quiet
          tarball="$(ls -1 *.tgz | head -n 1)"

          # Listed to a file on purpose: piping into `grep -q` under
          # `pipefail` makes tar fail with SIGPIPE once grep exits early.
          tar -tf "$tarball" > tarball-entries.txt

          # prepack stages the payload; publishing without it ships a launcher
          # that cannot install anything.
          for required in \
            package/payload/gateway.ps1 \
            package/payload/powershell/CopilotHarnessGateway.psm1 \
            package/payload/package-lock.json \
            package/bin/githubrelay.js
          do
            if ! grep -Fxq "$required" tarball-entries.txt; then
              echo "tarball is missing $required" >&2
              exit 1
            fi
          done

          echo "Tarball contents verified: $tarball"
          rm -f "$tarball" tarball-entries.txt

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        working-directory: packages/npm
        shell: bash
        run: |
          set -euo pipefail

          # Trusted publishing needs no token, but it can only be configured on
          # a package that already exists. Until either is set up, distribution
          # happens through the GitHub Release attached to this tag, so skip
          # rather than fail the run.
          if [[ -z "${NODE_AUTH_TOKEN:-}" && "${NPM_TRUSTED_PUBLISHING:-}" != "true" ]]; then
            echo "::notice::No npm credentials configured; skipping the registry publish."
            echo "Set the NPM_TOKEN secret, or configure trusted publishing and set the"
            echo "NPM_TRUSTED_PUBLISHING repository variable to true."
            exit 0
          fi

          npm publish --provenance
        env:
          # Ignored once trusted publishing is configured on npmjs.com, which
          # is the preferred path. Needed for the very first publish, because a
          # trusted publisher can only be configured on an existing package.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}

      - name: Attach the tarball to the release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        working-directory: packages/npm
        shell: bash
        run: |
          set -euo pipefail
          npm pack --quiet
          tarball="$(ls -1 *.tgz | head -n 1)"

          # Published next to the artifact because `npm pack` is not
          # byte-reproducible: a hash committed by hand goes stale the moment
          # CI rebuilds the tarball.
          sha256sum "$tarball" > "$tarball.sha256"

          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "githubrelay ${GITHUB_REF_NAME#npm-v}" \
              --notes "Install: \`irm https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/web-install.ps1 | iex\`"
          fi

          existing="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"

          # Releases are immutable: replacing a published tarball would
          # invalidate the checksum every existing installer already trusts.
          if [[ "$existing" == *"$tarball"* ]]; then
            echo "$tarball is already published for $GITHUB_REF_NAME; leaving it unchanged."
          else
            gh release upload "$GITHUB_REF_NAME" "$tarball" "$tarball.sha256" --repo "$GITHUB_REPOSITORY"
            echo "Attached $tarball and its checksum to $GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Dry run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: echo "Dry run only. Re-run with dry_run=false, or push an npm-v* tag, to publish."
